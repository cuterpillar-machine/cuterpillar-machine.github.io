name: Add New Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 0.1.2)'
        required: true
      description:
        description: 'Short description of the release (Ukrainian)'
        required: true
      description_en:
        description: 'Short description of the release (English); defaults to the Ukrainian one'
        required: false
      date:
        description: 'Release date (YYYY-MM-DD HH:MM:SS +0000)'
        required: false
      download_url:
        description: 'Download URL'
        required: true

jobs:
  add-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set date if not provided
        id: set-date
        run: |
          if [ -z "${{ github.event.inputs.date }}" ]; then
            echo "date=$(date -u +'%Y-%m-%d %H:%M:%S +0000')" >> $GITHUB_OUTPUT
          else
            echo "date=${{ github.event.inputs.date }}" >> $GITHUB_OUTPUT
          fi

      - name: Create version and documentation files
        env:
          VERSION: ${{ github.event.inputs.version }}
          DESCRIPTION_UK: ${{ github.event.inputs.description }}
          DESCRIPTION_EN: ${{ github.event.inputs.description_en || github.event.inputs.description }}
          DOWNLOAD_URL: ${{ github.event.inputs.download_url }}
          DATE: ${{ steps.set-date.outputs.date }}
        run: |
          # Ukrainian (default language) files go to the collection root, English ones to en/
          for LANG in uk en; do
            if [ "$LANG" = "uk" ]; then DIR=""; DESCRIPTION="$DESCRIPTION_UK"; else DIR="en/"; DESCRIPTION="$DESCRIPTION_EN"; fi
            mkdir -p "_versions/$DIR" "_documentations/$DIR"

            sed -e "s/{{VERSION}}/$VERSION/g" \
                -e "s/{{DESCRIPTION}}/$DESCRIPTION/g" \
                -e "s|{{DOWNLOAD_URL}}|$DOWNLOAD_URL|g" \
                -e "s/{{DATE}}/$DATE/g" \
                "_templates/version_template.$LANG.md" > "_versions/$DIR$VERSION.md"

            sed -e "s/{{VERSION}}/$VERSION/g" \
                -e "s/{{DESCRIPTION}}/$DESCRIPTION/g" \
                "_templates/documentation_template.$LANG.md" > "_documentations/$DIR$VERSION.md"
          done

      - name: Commit and push changes
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "_versions/$VERSION.md" "_versions/en/$VERSION.md" "_documentations/$VERSION.md" "_documentations/en/$VERSION.md"
          git commit -m "Add version $VERSION"
          git push
