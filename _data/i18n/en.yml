home:
  tagline: "The machine that measures, strips and cuts wire for you"
  intro: "Set the length, the strip points and the quantity. The machine feeds the wire, scores the insulation exactly where you need it and cuts each piece. One after another, until the batch is done."
  cta_download: "Download firmware"
  cta_docs: "Documentation"
  photo_placeholder: "Photo coming soon"
  hero_photo_alt: "The whole Cuterpillar machine on its wooden base: control panel, wire spool, guide rollers, feeder and blade mechanism"

  what:
    title: "What it does"
    items:
      - title: "Measures"
        text: "Feeds wire to a set length from 1 to 9999 mm."
      - title: "Strips"
        text: "Scores the insulation at up to 3 points: both ends and, for example, a mid-wire solder point."
      - title: "Cuts"
        text: "Cuts each piece and repeats for the whole batch: from 1 to 999 pieces."

  how:
    title: "How it works"
    intro: "Each piece goes through the same cycle. Before every job the blade homes to the end-stop, so it always starts from a known position."
    steps:
      - title: "Feed"
        text: "The stepper motor feeds wire up to the next cut point."
      - title: "Score"
        text: "The V-notch blades close just enough to cut the insulation without touching the copper. The depth follows from the copper diameter, picked on an AWG scale."
      - title: "Repeat"
        text: "Feed to the next point and score again, up to 3 points per piece."
      - title: "Cut"
        text: "The blades close fully and the piece is done. A stop request lets the current piece finish first."
    diagram_alt: "Wire with three strip points and a cut at the end"

  control:
    title: "Two ways to control it"
    items:
      - title: "On the machine"
        photo: "panel-start"
        photo_alt: "Control panel with the job summary on the display: 50 pcs × 90 mm, cuts at 2, 30, 88 mm, copper 1.2 mm"
        text: "Physical control panel with a built-in display: length, cut points, copper diameter, quantity and start, all in one bar."
      - title: "From your phone"
        text: "The machine serves its own web page. Open it in any browser, set up a job and watch its progress."
    wifi_title: "Wi-Fi modes"
    wifi:
      - title: "Home Wi-Fi"
        text: "The machine joins your router and is reachable at cut.local."
      - title: "Direct connection"
        text: "No router? The machine starts its own access point. The display shows QR codes for joining the network and opening the web page."
      - title: "Wireless updates"
        text: "New firmware is uploaded from the browser (OTA), no USB cable needed."

  gallery:
    title: "Photos and video"
    note: "Video is on the way."
    all_photos: "All photos"

  specs:
    title: "Specifications"
    note: "Most rows are firmware setting ranges. Max wire size is the physical limit: thicker wire does not fit between the blades."
    rows:
      - label: "Piece length"
        value: "1–9999 mm"
      - label: "Strip points per piece"
        value: "up to 3 (firmware limit, not a hardware one)"
      - label: "Quantity per job"
        value: "1–999"
      - label: "Copper diameter setting"
        value: "0.1–8.0 mm, step 0.1 (AWG scale)"
      - label: "Control"
        value: "Physical control panel with a built-in display, web UI"
      - label: "Max wire size"
        value: "10 AWG with silicone insulation (copper ≈ 2.6 mm diameter, ≈ 5.3 mm² cross-section)"

  release:
    title: "Latest release"
    released_on: "Released on"
    view_details: "Release details"
    all_versions: "All versions"

  support:
    title: "Support the project"
    text: "Your contributions help us build and improve the machine."

