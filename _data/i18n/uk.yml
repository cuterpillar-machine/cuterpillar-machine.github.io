home:
  tagline: "Машина, що відміряє, зачищає та ріже дріт за вас"
  intro: "Задайте довжину, точки надрізу та кількість. Машина подає дріт, надрізає ізоляцію саме там, де треба, і відрізає кожен шматок. Один за одним, поки партія не готова."
  cta_download: "Завантажити прошивку"
  cta_docs: "Документація"
  photo_placeholder: "Фото незабаром"
  hero_photo_alt: "Машина Cuterpillar повністю на дерев'яній основі: панель управління, котушка дроту, напрямні ролики, подавач і механізм ножів"

  what:
    title: "Що вона робить"
    items:
      - title: "Відміряє"
        text: "Подає дріт заданої довжини: від 1 до 9999 мм."
      - title: "Зачищає"
        text: "Надрізає ізоляцію до 3 точок: на обох кінцях і, наприклад, посередині під пайку."
      - title: "Ріже"
        text: "Відрізає кожен шматок і повторює для всієї партії: від 1 до 999 штук."

  how:
    title: "Як це працює"
    intro: "Кожен шматок проходить той самий цикл. Перед кожним завданням ніж повертається до кінцевого вимикача, тож завжди стартує з відомої позиції."
    steps:
      - title: "Подача"
        text: "Кроковий двигун подає дріт до наступної точки надрізу."
      - title: "Надріз"
        text: "V-подібні ножі сходяться рівно настільки, щоб прорізати ізоляцію, не зачепивши мідь. Глибина залежить від діаметра міді, який обирають за шкалою AWG."
      - title: "Повтор"
        text: "Подача до наступної точки і знову надріз, до 3 точок на шматок."
      - title: "Різ"
        text: "Ножі сходяться повністю, шматок готовий. Після команди «стоп» машина спершу доробляє поточний шматок."
    diagram_alt: "Дріт із трьома точками надрізу та різом наприкінці"

  control:
    title: "Два способи керування"
    items:
      - title: "На самій машині"
        photo: "panel-start"
        photo_alt: "Панель управління з підсумком завдання на дисплеї: 50 шт × 90 мм, надрізи на 2, 30, 88 мм, мідь 1,2 мм"
        text: "Фізична панель управління з вбудованим екраном: довжина, точки надрізу, діаметр міді, кількість і старт в одному меню."
      - title: "З телефона"
        text: "Машина сама віддає вебсторінку. Відкрийте її в будь-якому браузері, налаштуйте завдання і стежте за прогресом."
    wifi_title: "Режими Wi-Fi"
    wifi:
      - title: "Домашній Wi-Fi"
        text: "Машина підключається до вашого роутера і доступна за адресою cut.local."
      - title: "Пряме з'єднання"
        text: "Немає роутера? Машина запускає власну точку доступу. На дисплеї з'являються QR-коди для підключення до мережі та відкриття вебсторінки."
      - title: "Оновлення по повітрю"
        text: "Нова прошивка завантажується з браузера (OTA), без USB-кабелю."

  gallery:
    title: "Фото та відео"
    note: "Відео вже готуємо."
    all_photos: "Усі фото"

  specs:
    title: "Характеристики"
    note: "Більшість рядків — діапазони налаштувань прошивки. Максимальний переріз — фізична межа: товстіший дріт не вміщується між ножами."
    rows:
      - label: "Довжина шматка"
        value: "1–9999 мм"
      - label: "Точок надрізу на шматок"
        value: "до 3 (обмеження прошивки, не механіки)"
      - label: "Кількість за завдання"
        value: "1–999"
      - label: "Налаштування діаметра міді"
        value: "0,1–8,0 мм, крок 0,1 (шкала AWG)"
      - label: "Керування"
        value: "Фізична панель управління з вбудованим екраном, вебінтерфейс"
      - label: "Максимальний переріз дроту"
        value: "10 AWG у силіконовій ізоляції (мідь: діаметр ≈ 2,6 мм, переріз ≈ 5,3 мм²)"

  release:
    title: "Найновіший реліз"
    released_on: "Випущено"
    view_details: "Деталі релізу"
    all_versions: "Усі версії"

  support:
    title: "Підтримайте проєкт"
    text: "Ваші внески допомагають нам будувати та вдосконалювати машину."

