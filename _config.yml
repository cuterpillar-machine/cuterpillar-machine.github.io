# Site settings
title: Cuterpillar machine
url: "https://cuterpillar-machine.github.io"
baseurl: ""
githuburl: https://github.com/cuterpillar-machine
description: >-
  Автоматична машина для відмірювання, зачищення та різання дроту.
versions_limit: 3

# theme
lang: uk
locale: uk_UA
languages: [uk, en]
site:
  favicon: "/assets/favicon.ico"

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

# Social & Author
twitter:
  username: cuterpillar
  card: summary_large_image
author:
  name: Cuterpillar Team
  twitter: cuterpillar
facebook:
  app_id:
  publisher:
  admins:

# SEO
logo: /assets/favicon-512x512.png
social:
  type: SoftwareApplication
  name: Cuterpillar Machine
  url: https://cuterpillar-machine.github.io
  links:
    - https://github.com/cuterpillar-machine
  same_as:
    - https://github.com/cuterpillar-machine

# Payment IDs (shared by all languages; texts live in _data/i18n/)
support:
  wayforpay_button_id: "123"
  monobank_jar_id: "321"

# Google services
google_analytics: G-68D4G5CNZ4

collections:
  versions:
    output: true
    permalink: /versions/:path.html
  documentations:
    output: true
    permalink: /documentations/:path.html
future: true

# Language: Ukrainian by default, English under /en/ (and _versions/en, _documentations/en,
# whose files set their /en/... permalink themselves: :name would turn 0.0.1 into 0-0-1)
defaults:
  - scope:
      path: ""
    values:
      lang: uk
      locale: uk_UA
  - scope:
      path: "en"
    values:
      lang: en
      locale: en_US
  - scope:
      path: "_versions/en"
    values:
      lang: en
      locale: en_US
  - scope:
      path: "_documentations/en"
    values:
      lang: en
      locale: en_US
